function resolveTrans(input, lang = 'en') {
  if (!input) return '';
  if (typeof input === 'object') {
    if (lang === 'kn' && input.kn) return input.kn;
    return input.en || input.kn || '';
  }
  const text = String(input).trim();
  if (lang === 'en') return text;
  if (translations[text]) return translations[text];
  return text;
}

function CountdownTimer({ targetDate, title, compact = false, lang = 'en' }) {
  const calculateTimeLeft = () => {
    const diff = new Date(targetDate).getTime() - Date.now();
    if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, isCompleted: true };
    return {
      days: Math.floor(diff / (1000 * 60 * 60 * 24)),
      hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
      minutes: Math.floor((diff / 1000 / 60) % 60),
      seconds: Math.floor((diff / 1000) % 60),
      isCompleted: false
    };
  };

  const [timeLeft, setTimeLeft] = useState(calculateTimeLeft);

  useEffect(() => {
    const timer = setInterval(() => setTimeLeft(calculateTimeLeft()), 1000);
    return () => clearInterval(timer);
  }, [targetDate]);

  if (timeLeft.isCompleted) {
    return (
      <div className={`countdown-box ${compact ? 'compact' : ''} completed`}>
        <div className="countdown-complete-msg">
          🎉 {lang === 'kn' ? 'ಸಮಾರಂಭ ಪ್ರಾರಂಭವಾಗಿದೆ!' : 'The Celebration has Begun!'} 🎉
        </div>
      </div>
    );
  }

  const pad = (n) => String(n).padStart(2, '0');

  return (
    <div className={`countdown-box ${compact ? 'compact' : ''}`}>
      {title && (
        <div className="countdown-title">
          <span className="countdown-icon">⏳</span> {resolveTrans(title, lang)}
        </div>
      )}
      <div className="countdown-grid">
        <div className="countdown-unit">
          <div className="countdown-num">{timeLeft.days}</div>
          <div className="countdown-lbl">{lang === 'kn' ? 'ದಿನಗಳು' : 'Days'}</div>
        </div>
        <div className="countdown-sep">:</div>
        <div className="countdown-unit">
          <div className="countdown-num">{pad(timeLeft.hours)}</div>
          <div className="countdown-lbl">{lang === 'kn' ? 'ಗಂಟೆಗಳು' : 'Hours'}</div>
        </div>
        <div className="countdown-sep">:</div>
        <div className="countdown-unit">
          <div className="countdown-num">{pad(timeLeft.minutes)}</div>
          <div className="countdown-lbl">{lang === 'kn' ? 'ನಿಮಿಷಗಳು' : 'Mins'}</div>
        </div>
        <div className="countdown-sep">:</div>
        <div className="countdown-unit">
          <div className="countdown-num">{pad(timeLeft.seconds)}</div>
          <div className="countdown-lbl">{lang === 'kn' ? 'ಸೆಕೆಂಡುಗಳು' : 'Secs'}</div>
        </div>
      </div>
    </div>
  );
}

                You can also switch language at any time from the top menu bar.
                <br />
                ಮೇಲ್ಭಾಗದ ಮೆನುವಿನಿಂದ ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ಭಾಷೆ ಬದಲಾಯಿಸಬಹುದು.
              </small>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
